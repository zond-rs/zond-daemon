syntax = "proto3";

package zond.v1;

// Driving one scan from outside the process.
//
// Four calls, which is the whole of what a front end needs: start a scan, follow
// it, ask where it got to, stop it. Everything else a caller might want, reading
// an archived scan or comparing two, is the same engine reached the same way and
// is added here when something asks for it rather than in advance.
service Scans {
  // Starts a scan and answers with its identity.
  //
  // Returns as soon as the scan is accepted, not when it finishes. A scan of a
  // /16 runs for hours and a call that waited for it would be a call nothing
  // could hold open.
  rpc Start(StartRequest) returns (StartResponse);

  // Follows a scan from a cursor: what it has found so far, then the live tail.
  //
  // A cursor rather than a subscription that only runs forward from now, so a
  // client that reconnects resumes where it stopped instead of starting blind.
  // A scan that finished last week answers this as readily as one still running,
  // the journal being the durable form of the same log.
  rpc Watch(WatchRequest) returns (stream Event);

  // Where a scan has got to, as one answer rather than a stream.
  rpc Get(GetRequest) returns (ScanState);

  // Winds a scan down.
  //
  // Stopping is not cancelling. The scan keeps what it has already found and
  // still writes its report, and the report says it was stopped.
  rpc Stop(StopRequest) returns (ScanState);

  // What a scan found, written out in one of the formats the engine knows.
  //
  // For a scan that is over. A scan still running has no report to write, and
  // `Watch` is how its findings arrive in the meantime.
  rpc Export(ExportRequest) returns (ExportResponse);

  // The scans this daemon has a record of, newest first.
  //
  // Everything it is running, and everything written down where it records,
  // including scans some earlier process ran.
  rpc List(ListRequest) returns (ListResponse);

  // Throws away records this daemon no longer needs.
  //
  // A record nothing names is a record of a scan somebody ran once, and a
  // daemon that keeps every one of them forever fills a disk. This is how an
  // operator says which are worth keeping.
  rpc Prune(PruneRequest) returns (PruneResponse);

  // Continues a scan that stopped part way.
  //
  // The plan comes from the record rather than from this call, which is what
  // makes it the same job: the targets, the ports and the order are the ones the
  // first sitting was working through, and what it settled is not asked again.
  rpc Resume(ResumeRequest) returns (StartResponse);

  // What changed between two scans.
  rpc Diff(DiffRequest) returns (DiffResponse);

  // Several scans folded into one report.
  rpc Merge(MergeRequest) returns (ExportResponse);
}

// ── Starting ────────────────────────────────────────────────────────────────

// What to scan, and how.
//
// The wire form of `zond_engine::import::request::ScanRequest`, field for field,
// so a request document written for the engine's own reader is a valid body here
// and the two cannot drift apart. The engine's reader refuses an unknown key
// rather than warning about it, and so does this.
message StartRequest {
  // Addresses, ranges, CIDR blocks, hostnames, or the names this host knows:
  // `lan`, `%en0`. The engine's target grammar, unchanged.
  repeated string targets = 1;

  // Addresses the scan may not record a finding against, in the same grammar.
  repeated string exclude = 2;

  // Ports, written as the engine writes them: `22,80,443`, `1-1024,8080`, `-`
  // for all of them. Absent leaves the engine's own default list.
  optional string ports = 3;

  optional ServiceDetection service_detection = 4;
  optional OsDetection os_detection = 5;

  // The most a detection may do to a target. Absent runs none of them.
  optional DetectionClass detection = 6;

  optional bool traceroute = 7;
  optional bool characterise = 8;
  optional bool icmp_evidence = 9;

  // Scans every target without asking first whether anything is there, for a
  // host behind a firewall that answers no knock.
  optional bool assume_up = 10;

  // IP protocol numbers to probe for, for a scan asking which protocols a host
  // speaks rather than which ports it listens on.
  repeated uint32 ip_protocols = 11;

  // The address to send from, for a host whose default route is not the way to
  // the target. More than one covers both families.
  repeated string send_source = 12;

  optional Evasion evasion = 13;

  // What the scan is asking. Absent asks which ports are open, which is what
  // most callers want and what every field above is written for.
  //
  // A discovery sweep ignores `ports`. A listen ignores `targets` and `ports`
  // alike and reads `links` instead, having asked nothing of anybody.
  ScanKind kind = 15;

  // For a listen: the links to watch, named as this host names them, `en0`.
  repeated string links = 16;

  // For a listen: how long to watch for. Absent watches until stopped, a
  // listener having no work to run out of.
  optional uint32 listen_for_seconds = 17;

  // The knobs worth setting once and keeping. A settings file on the daemon's
  // own host is read first, and anything named here overrides it for this run.
  optional Settings settings = 14;
}

message StartResponse {
  // The scan's identity, which is also its journal's. Crockford base32, so it
  // survives being read aloud and written down.
  string scan_id = 1;
}

// How hard the engine works to name what is behind an open port.
enum ServiceDetection {
  SERVICE_DETECTION_UNSPECIFIED = 0;
  // Nothing is asked. A port's state is read and no connection is opened.
  SERVICE_DETECTION_OFF = 1;
  // Whatever a service volunteers on connect, and nothing more.
  SERVICE_DETECTION_BANNER = 2;
  // Probes chosen for the port, for a service that says nothing unprompted.
  SERVICE_DETECTION_PROBE = 3;
  // Every probe that might apply, in exchange for taking longer.
  SERVICE_DETECTION_THOROUGH = 4;
}

// Whether the engine asks a host what it is running on, and how loudly.
enum OsDetection {
  OS_DETECTION_UNSPECIFIED = 0;
  OS_DETECTION_OFF = 1;
  OS_DETECTION_PASSIVE = 2;
  OS_DETECTION_ACTIVE = 3;
  OS_DETECTION_AGGRESSIVE = 4;
}

// What a detection does to the target it runs against.
//
// Ordered by what it costs that target rather than by what it finds. A caller
// names the most they are authorised to do and the engine runs nothing above it.
// Leaving the field unset runs no detections at all, which is why there is no
// value here meaning none: absent already says it.
enum DetectionClass {
  DETECTION_CLASS_UNSPECIFIED = 0;
  // Reads what the scan already gathered. Sends nothing of its own.
  DETECTION_CLASS_PASSIVE = 1;
  // Asks the service a question it is meant to answer.
  DETECTION_CLASS_ACTIVE_BENIGN = 2;
  // Changes something on the target, however small.
  DETECTION_CLASS_ACTIVE_MUTATING = 3;
  // Proves a vulnerability by using it.
  DETECTION_CLASS_EXPLOIT = 4;
  // Can take the service down, and is never reached by accident.
  DETECTION_CLASS_DOS = 5;
}

// What a probe looks like on the wire, for a scan that would rather not look
// like every other scan.
//
// Refused rather than ignored where a value will not fit: a TTL of 300 or a
// hardware address that is not one is a mistake worth naming, and a scan that
// quietly dropped it would send probes nobody asked for.
message Evasion {
  // 1 to 65535.
  optional uint32 source_port = 1;
  // 1 to 255.
  optional uint32 ttl = 2;
  // The size to fragment probes to, in bytes.
  optional uint32 fragment_mtu = 3;
  // Bytes of padding to add to each probe.
  optional uint32 padding = 4;
  // Addresses to make the probes appear to come from as well as this host.
  repeated string decoys = 5;
  // The TCP flag bits to set, as a number. 0 to 255.
  optional uint32 flags = 6;
  // The hardware address to send from, `00:00:5e:00:53:01`.
  optional string spoof_mac = 7;
  // Sends probes with a checksum that is wrong on purpose, which some
  // middleboxes answer and most hosts drop.
  optional bool bad_tcp_checksum = 8;
}

// The knobs worth setting once, rather than per run.
message Settings {
  optional ScanEffort effort = 1;
  // Seconds a host gets before the scan leaves it.
  optional uint32 host_timeout = 2;
  // Seconds the whole scan gets before it winds itself down.
  optional uint32 scan_timeout = 3;
  // Probes per second, at most and at least. Neither may be zero.
  optional uint32 max_probe_rate = 4;
  optional uint32 min_probe_rate = 5;
  // How many times one target is asked before the scan gives up on it. 1 to 255.
  optional uint32 max_attempts = 6;
  // Generates no DNS traffic at all, for a run that must not be seen asking.
  optional bool no_dns = 7;
  // Masks hostnames and hardware addresses in what comes back.
  optional bool redact = 8;
  optional bool tls_enumeration = 9;
  // The shortest gap between two probes aimed at one host, in milliseconds.
  // Milliseconds rather than seconds because a second between probes is a scan
  // nobody would wait for.
  optional uint32 host_probe_interval_ms = 10;
  // Backs off from a host that answers nothing, rather than spending the whole
  // retry budget on it.
  optional bool dampen_silent_hosts = 11;
  // The ports a request that names none is taken to mean.
  optional string default_ports = 12;
  optional TcpScanTechnique tcp_technique = 13;
  optional SctpScanTechnique sctp_technique = 14;
  optional SendMode send_mode = 15;
  // Multiplies every timeout the scan works out for itself, for a network
  // slower or faster than the one the defaults assume. Greater than zero.
  optional double timeout_scale = 16;
}

// Which TCP probe a scan sends, each answered differently by a different sort of
// host and firewall.
enum TcpScanTechnique {
  TCP_SCAN_TECHNIQUE_UNSPECIFIED = 0;
  // A half-open handshake. What a scan does unless told otherwise.
  TCP_SCAN_TECHNIQUE_SYN = 1;
  TCP_SCAN_TECHNIQUE_ACK = 2;
  TCP_SCAN_TECHNIQUE_FIN = 3;
  TCP_SCAN_TECHNIQUE_NULL = 4;
  TCP_SCAN_TECHNIQUE_XMAS = 5;
  TCP_SCAN_TECHNIQUE_MAIMON = 6;
  TCP_SCAN_TECHNIQUE_WINDOW = 7;
}

enum SctpScanTechnique {
  SCTP_SCAN_TECHNIQUE_UNSPECIFIED = 0;
  SCTP_SCAN_TECHNIQUE_INIT = 1;
  SCTP_SCAN_TECHNIQUE_COOKIE_ECHO = 2;
}

// How a probe reaches the wire.
enum SendMode {
  SEND_MODE_UNSPECIFIED = 0;
  // Whichever of the two works here. What a scan does unless told otherwise.
  SEND_MODE_AUTO = 1;
  // Built as a whole frame and put on the link.
  SEND_MODE_ETHERNET = 2;
  // Handed to a raw socket, letting the kernel address it.
  SEND_MODE_RAW_SOCKET = 3;
}

// How much the engine spends on being sure, against how long it takes.
enum ScanEffort {
  SCAN_EFFORT_UNSPECIFIED = 0;
  // One probe per target. Fastest, and least sure about a target that was busy.
  SCAN_EFFORT_SINGLE = 1;
  SCAN_EFFORT_FAST = 2;
  SCAN_EFFORT_BALANCED = 3;
  // Every retry the policy allows, for a network that drops probes.
  SCAN_EFFORT_THOROUGH = 4;
}

// ── Following ───────────────────────────────────────────────────────────────

message WatchRequest {
  string scan_id = 1;

  // Where to resume. Zero asks for a compacted snapshot of every host as it
  // now stands, followed by the live tail, which is what a client opening the
  // scan for the first time wants. Anything else asks for what happened after
  // that sequence number and nothing before it.
  uint64 from_seq = 2;
}

// One thing that happened, in the order it happened.
message Event {
  // Its place in the scan's log. Contiguous per scan, and what a client hands
  // back to Watch to resume.
  uint64 seq = 1;

  oneof body {
    HostChanged host = 2;
    StageChanged stage = 3;
    Progress progress = 4;
    ScannerFailed failure = 5;
    Finished finished = 6;
  }
}

// A host, as it now stands.
//
// ## Why the host is a document rather than a message
//
// The host travels as the JSON that `zond-report-v1` already describes, rather
// than as a second description of the same thing written in proto. That schema
// is published, versioned, and held to the engine's output by a conformance test
// on every build. A proto mirror of it would be a second contract for one
// document, maintained by hand, and the two would disagree the first time either
// moved.
//
// A consumer that wants types for it generates them from the schema, the same
// way it generates these messages from this file. One contract per thing, each
// in the form that thing is already written in.
message HostChanged {
  // The address the engine keys the host under, bracketed if it is IPv6 with a
  // port, and carrying its zone if it is link-local.
  string address = 1;

  // One host, shaped as `zond-report-v1` shapes one.
  string document = 2;
}

// The scan has moved on to another kind of work.
//
// A scan is not one uniform stretch: the sweep settles its plan and then
// services, detections, operating systems and paths are read off what it found,
// and that tail routinely takes several times as long as the sweep did.
message StageChanged {
  Stage stage = 1;
}

enum Stage {
  STAGE_UNSPECIFIED = 0;
  STAGE_DISCOVERY = 1;
  STAGE_PORTS = 2;
  STAGE_SERVICES = 3;
  STAGE_DETECTIONS = 4;
  STAGE_TLS = 5;
  STAGE_OS = 6;
  STAGE_TRACEROUTE = 7;
  STAGE_LISTENING = 8;
  STAGE_FINISHING = 9;
}

// How far along the scan is.
//
// Two reckonings, because they answer different questions. `stage_done` against
// `stage_total` is how far through the work in hand; `overall_done` against
// `overall_total` is how far through the run, across every stage it expects to
// reach. A figure of the first kind alone starts over at every stage boundary.
message Progress {
  Stage stage = 1;

  // Within the current stage. Absent where the stage could not be sized before
  // it began, which is a stage running with no end in sight rather than one that
  // has not started.
  optional uint64 stage_done = 2;
  optional uint64 stage_total = 3;

  // Across the run. Absent for a scan whose stages could not be predicted.
  optional uint64 overall_done = 4;
  optional uint64 overall_total = 5;
}

// A strategy failed to start or ended abnormally.
//
// The scan carries on with whatever strategies remain, so results are incomplete
// rather than absent, and the report keeps every one of these whether or not
// anybody was listening.
message ScannerFailed {
  string scanner = 1;
  string reason = 2;
}

// The scan is over.
message Finished {
  StopCause cause = 1;
}

// Why a scan stopped.
//
// A report that called an expired budget an abort would say somebody stopped a
// scan that stopped itself, which is a claim about a person that nothing
// observed.
enum StopCause {
  STOP_CAUSE_UNSPECIFIED = 0;
  // It ran out of work, which is the ordinary end.
  STOP_CAUSE_COMPLETED = 1;
  // A caller asked it to stop.
  STOP_CAUSE_ABORTED = 2;
  // Its wall-clock budget ran out.
  STOP_CAUSE_TIMED_OUT = 3;
}

// ── Asking and stopping ─────────────────────────────────────────────────────

message GetRequest {
  string scan_id = 1;
}

message StopRequest {
  string scan_id = 1;
}

// What a scan has found and where it has got to.
message ScanState {
  string scan_id = 1;

  // Whether it is still going.
  bool running = 2;

  // Set once the scan is over.
  optional StopCause cause = 3;

  Progress progress = 4;

  // The highest sequence number the scan's log holds, which is where a client
  // that wants only what happens next starts watching from.
  uint64 seq = 5;

  // Always absent. `Export` writes a report, in any of five formats and without
  // putting the whole of one into every answer about how a scan is going.
  optional string report = 6 [deprecated = true];
}

// ── Writing it down ─────────────────────────────────────────────────────────

message ExportRequest {
  string scan_id = 1;
  ExportFormat format = 2;

  // Masks hostnames and hardware addresses in what comes back. Set on the scan
  // itself where every reader should see it masked; set here where one reader
  // should and others should not.
  optional bool redact = 3;
}

message ExportResponse {
  // The whole document, as text. Every format this engine writes is text.
  string document = 1;

  // What it was written as, echoed so a caller holding several does not have to
  // remember which is which.
  ExportFormat format = 2;
}

// The shapes a scan can be written down in.
enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  // This engine's own, and the only one that carries everything it found. Held
  // to `zond-report-v1` by a test on every build.
  EXPORT_FORMAT_JSON = 1;
  // The same, one record per line, so a reader can take it a host at a time and
  // a file cut short is still readable.
  EXPORT_FORMAT_JSONL = 2;
  // A flat table, one row per host and port, for a spreadsheet.
  EXPORT_FORMAT_CSV = 3;
  // One page, for reading rather than parsing.
  EXPORT_FORMAT_HTML = 4;
  // Nmap's XML, for the pipelines that already read it.
  EXPORT_FORMAT_NMAP_XML = 5;
}

// ── Finding them again ──────────────────────────────────────────────────────

message ListRequest {
  // At most this many, newest first. Absent takes the daemon's own default,
  // which is a hundred.
  optional uint32 limit = 1;
}

message ListResponse {
  repeated ScanListing scans = 1;
}

// One scan, as much of it as can be said without reading the whole record.
message ScanListing {
  string scan_id = 1;
  ScanKind kind = 2;

  // When it started, RFC 3339.
  string started_at = 3;

  // What it was for, in a few words, as the record itself puts it.
  string summary = 4;

  // How many targets the plan held, and how many of them are settled. Absent
  // where the plan is too large to count, which describes a scan no run
  // finishes.
  optional uint64 planned = 5;
  optional uint64 settled = 6;

  // Whether it reached the end of its plan.
  bool complete = 7;

  // Who, if anyone, is running it.
  ScanHold hold = 8;
}

enum ScanKind {
  SCAN_KIND_UNSPECIFIED = 0;
  // Which addresses are alive.
  SCAN_KIND_DISCOVERY = 1;
  // Which ports of known hosts are open.
  SCAN_KIND_PORT_SCAN = 2;
  // What a link carries, having sent nothing.
  SCAN_KIND_LISTEN = 3;
}

// Whether a scan is being run right now, and by what.
enum ScanHold {
  SCAN_HOLD_UNSPECIFIED = 0;
  // Nobody is running it. Finished, or stopped and waiting to be continued.
  SCAN_HOLD_FREE = 1;
  // A process is running it now.
  SCAN_HOLD_HELD = 2;
  // A process was running it and is gone. Everything it had reached is on
  // disk, and it can be continued.
  SCAN_HOLD_CRASHED = 3;
}

// ── Throwing them away ──────────────────────────────────────────────────────

// Which records are worth keeping, by age and by whether the scan finished.
//
// Both are ages in seconds, and both are optional: a field left out keeps every
// record of that kind however old. Zero is not "keep nothing missed": it means
// older than no time at all, which is all of them.
message PruneRequest {
  // Records of scans that reached the end of their plan.
  optional uint32 completed_after_seconds = 1;

  // Records of scans that did not. These are the ones a resume would have
  // continued, so a caller that keeps anything usually keeps these longer.
  optional uint32 incomplete_after_seconds = 2;
}

message PruneResponse {
  // The scans whose records are gone.
  repeated string removed = 1;

  // The ones that stayed, and why. A record being used by a running scan is the
  // ordinary reason, and it is not an error: it will be prunable later.
  repeated HeldRecord kept = 2;
}

message HeldRecord {
  string scan_id = 1;
  string reason = 2;
}

// ── Continuing, comparing, folding ──────────────────────────────────────────

message ResumeRequest {
  // The scan to continue. It has to be one this daemon has a record of, and one
  // no other process is running.
  string scan_id = 1;
}

message DiffRequest {
  // What the network looked like before, and what it looks like now. Both are
  // scans this daemon has a record of.
  string baseline_id = 1;
  string current_id = 2;

  DiffFormat format = 3;
}

message DiffResponse {
  string document = 1;
  DiffFormat format = 2;
}

// A comparison is its own shape, so it has its own two formats rather than the
// five a report has.
enum DiffFormat {
  DIFF_FORMAT_UNSPECIFIED = 0;
  DIFF_FORMAT_JSON = 1;
  DIFF_FORMAT_HTML = 2;
}

message MergeRequest {
  // The scans to fold together, in the order they should be folded. Two or more.
  repeated string scan_ids = 1;

  // The folded report is a report, so it is written in the same five formats
  // any other is.
  ExportFormat format = 2;

  optional bool redact = 3;
}

// ── Failing ─────────────────────────────────────────────────────────────────

// Why a call could not be answered.
//
// `code` is the engine's own stable name for the failure, `scan.wrong_phase` or
// `request.no_targets`, and is what a client branches on. `message` is written
// for a person and is free to be reworded between releases.
message Error {
  string code = 1;
  string message = 2;
}
