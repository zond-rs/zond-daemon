name: rust

on:
  push:
    # The working branch as well as main, so what breaks is found on the branch
    # that broke it rather than after it has been merged.
    branches: [main, feat/main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Both repositories, side by side, because this crate builds against the
      # engine on disk beside it rather than a published version. The two paths
      # are what `../zond-engine` in Cargo.toml resolves to.
      - uses: actions/checkout@v4
        with:
          path: zond-daemon

      - uses: actions/checkout@v4
        with:
          repository: zond-rs/zond-engine
          path: zond-engine

      # The engine links against libpcap, which a runner does not have. The
      # engine's own workflows install it the same way.
      - name: Install libpcap
        run: sudo apt-get update || true; sudo apt-get install -y libpcap-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: cargo fmt --check
        working-directory: zond-daemon
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: zond-daemon
      - run: cargo test
        working-directory: zond-daemon
